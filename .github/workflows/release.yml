name: Build & Release SmartHome APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag phiên bản cần phát hành (ví dụ: v0.3.0)'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Neu da cau hinh Keystore trong GitHub Secrets thi giai ma de ky ban release chuan
      - name: Restore Keystore from Secrets (neu co)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > smarthome-release.jks
          echo "${{ secrets.KEYSTORE_PROPERTIES }}" > keystore.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_NAME="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          else
            TAG_NAME="v0.3.0"
          fi
          RELEASE_APK="SmartHome-${TAG_NAME}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          echo "apk_path=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          tag_name: ${{ steps.prepare_asset.outputs.tag_name }}
          name: Bản cập nhật ${{ steps.prepare_asset.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
