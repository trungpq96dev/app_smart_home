name: beszel

# Gioi han dung luong log de khong lam day SSD tren serverubuntu
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${BESZEL_PORT:-8090}:8090"
    environment:
      APP_URL: ${APP_URL:-http://192.168.0.50:8090}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  beszel-agent:
    # Dung ban :alpine (co san smartmontools) de doc S.M.A.R.T o cung SATA
    image: henrygd/beszel-agent:alpine
    container_name: beszel-agent
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    cap_add:
      - SYS_RAWIO
    devices:
      - /dev/sda:/dev/sda
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://127.0.0.1:${BESZEL_PORT:-8090}
      KEY: ${KEY:-}
      TOKEN: ${TOKEN:-}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
