# ==============================================================================
# CẤU HÌNH MẪU GO2RTC CHO 3 CAMERA RTSP NỘI BỘ (serverubuntu 192.168.0.50)
# Sao chép thành `go2rtc.yaml` trên serverubuntu và điền IP tĩnh + mật khẩu thật.
# KHÔNG đẩy file `go2rtc.yaml` chứa mật khẩu thật lên Git!
# ==============================================================================
#
# Lưu ý chuẩn bị trên router & ứng dụng hãng (Mục 2.1):
# 1. Gán IP tĩnh (DHCP Reservation) trên router cho cả 3 camera:
#      - Imou Ranger 2 3MP (A32) : ví dụ 192.168.0.101
#      - Ezviz C6N               : ví dụ 192.168.0.102
#      - Ezviz H6C               : ví dụ 192.168.0.103
# 2. Trên app Ezviz: vào Cài đặt camera -> Mạng cục bộ -> Bật RTSP,
#    đồng thời TẮT "Mã hóa hình ảnh" (Image Encryption) để go2rtc giải mã được.
# 3. Dùng luồng phụ `_sd` (H.264) cho WebView trên Samsung Tab A7 Lite để tránh
#    đen hình (H.265/HEVC không phát WebRTC trực tiếp) và tiết kiệm RAM/CPU.
# 4. Dùng luồng chính (không có hậu tố `_sd`) cho đầu ghi 24/24 và nhận diện
#    khuôn mặt YuNet + SFace (ảnh HD rõ nét hơn nhiều).

api:
  listen: ":1984"
  # Nên đặt tài khoản đăng nhập cho go2rtc (dùng chung với camera_recorder :1985)
  # username: "admin"
  # password: "MAT_KHAU_GO2RTC"

rtsp:
  listen: ":8554"

webrtc:
  candidates:
    - 192.168.0.50:8555
    - stun:8555

streams:
  # --- 1. Imou Ranger 2 3MP (A32) - Cửa chính ---
  # SAFETY_CODE là mã in ở tem đáy camera Imou
  cua_chinh:
    - "rtsp://admin:SAFETY_CODE@192.168.0.101:554/cam/realmonitor?channel=1&subtype=0"
  cua_chinh_sd:
    - "rtsp://admin:SAFETY_CODE@192.168.0.101:554/cam/realmonitor?channel=1&subtype=1"
    # Nếu camera đang để H.265 và tablet bị đen hình, bỏ ghi chú dòng dưới để đổi sang H.264:
    # - "ffmpeg:cua_chinh_sd#video=h264#audio=opus"

  # --- 2. Ezviz C6N - Phòng khách ---
  # VERIFY_CODE là mã 6 ký tự in ở tem đáy camera Ezviz
  phong_khach:
    - "rtsp://admin:VERIFY_CODE@192.168.0.102:554/h264/ch1/main/av_stream"
  phong_khach_sd:
    - "rtsp://admin:VERIFY_CODE@192.168.0.102:554/h264/ch1/sub/av_stream"

  # --- 3. Ezviz H6C - Cầu thang / Hành lang ---
  cau_thang:
    - "rtsp://admin:VERIFY_CODE@192.168.0.103:554/h264/ch1/main/av_stream"
  cau_thang_sd:
    - "rtsp://admin:VERIFY_CODE@192.168.0.103:554/h264/ch1/sub/av_stream"
