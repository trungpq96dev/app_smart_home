name: server-collector

services:
  server-collector:
    build: .
    image: server-collector:1.1
    container_name: server-collector
    restart: unless-stopped

    env_file:
      - .env

    # Doc so cua HOST, khong phai cua container:
    #  - pid: host        -> thay toan bo tien trinh host (uptime, process)
    #  - network_mode host -> doc toc do mang that cua server + goi thang
    #                         Mosquitto 127.0.0.1 tren host + mo cong 1986 noi bo
    #                         cho SmartHome Web khi DOCKER_CONTROL_ENABLED=true
    pid: host
    network_mode: host

    # Chay root de doc /sys (nhiet do) va Docker socket.
    # Khong cap them dac quyen; lenh start/stop/restart duoc bao ve bang:
    #   - Khong nhan lenh qua MQTT
    #   - Bearer token (DOCKER_CONTROL_TOKEN >= 16 ky tu)
    #   - Allowlist (DOCKER_ALLOWED_CONTAINERS) + danh sach bao ve cung
    user: "0:0"
    security_opt:
      - no-new-privileges:true

    volumes:
      # Host root: lay os-release, hostname, /proc/cpuinfo va dung luong o dia that.
      - /:/rootfs:ro
      # Cam bien nhiet do (/sys/class/hwmon). Khong co thi nhiet do = null.
      # RAPL (dien nang CPU) doc qua /rootfs/sys vi Docker che
      # /sys/devices/virtual/powercap bang tmpfs rong - xem server_collector.py.
      - /sys:/sys:ro
      # Docker socket: doc trang thai + CPU%/RAM tung container, va chi ghi lenh
      # start/stop/restart khi DOCKER_CONTROL_ENABLED=true + du token + allowlist.
      # Bo dong nay neu khong muon lo socket -> the Docker se trong.
      - /var/run/docker.sock:/var/run/docker.sock

    mem_limit: 128m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
