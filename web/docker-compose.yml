services:
  smarthome-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthome-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      CONFIG_PATH: "/app/data/config.json"
      # Các biến môi trường dưới đây chỉ làm giá trị khởi tạo ban đầu nếu chưa có data/config.json
      MQTT_HOST: "${MQTT_HOST:-192.168.0.50}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_TLS: "${MQTT_TLS:-false}"
      MQTT_USER: "${MQTT_USER:-iot}"
      MQTT_PASS: "${MQTT_PASS:-}"
      GO2RTC_HOST: "${GO2RTC_HOST:-192.168.0.50}"
      GO2RTC_PORT: "${GO2RTC_PORT:-1984}"
      GO2RTC_USER: "${GO2RTC_USER:-}"
      GO2RTC_PASS: "${GO2RTC_PASS:-}"
      WEATHER_NAME: "${WEATHER_NAME:-Hà Nội}"
      WEATHER_LAT: "${WEATHER_LAT:-21.0278}"
      WEATHER_LON: "${WEATHER_LON:-105.8342}"
      AQUACONTROL_URL: "${AQUACONTROL_URL:-}"

